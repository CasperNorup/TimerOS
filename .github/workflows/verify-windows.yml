name: TimerOS Windows verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/verify-windows.yml'
      - 'index.html'
      - 'package*.json'
      - 'tsconfig.json'
      - 'src/**'
      - 'src-tauri/**'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: timeros-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the Windows installer
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust format check failed.' }
          npm run tauri -- build -- --locked
          if ($LASTEXITCODE -ne 0) { throw 'TimerOS installer build failed.' }
          $version = (Get-Content -LiteralPath src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $installers = @(Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected one TimerOS Windows installer.' }
          "TIMEROS_VERSION=$version" >> $env:GITHUB_ENV
          "TIMEROS_INSTALLER=$($installers[0].FullName)" >> $env:GITHUB_ENV
      - name: Verify the installer and the installed app
        run: ./tests/windows-installer.ps1 -Installer $env:TIMEROS_INSTALLER
      - name: Upload the verified Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: TimerOS-${{ env.TIMEROS_VERSION }}-Windows-x64
          path: ${{ env.TIMEROS_INSTALLER }}
          if-no-files-found: error
          retention-days: 60
